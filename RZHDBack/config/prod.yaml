env: "prod"

http_server:
  host: "0.0.0.0"
  port: 8080
  timeout: 30s
  idle_timeout: 120s
  read_timeout: 30s
  write_timeout: 30s

db_postgres:
  host: "db_postgres_prod"
  port: 5432
  user: "kotov_admin"
  db_name: "ip_kotov_db"
  ssl_mode: "disable"

storage:
  path: "./data/catalog.db"

cors:
  allowed_origins:
    - "http://localhost:80"
    - "http://127.0.0.1:80"
    - "http://localhost:5173"
    - "http://localhost:8080"
    - "http://localhost:3000"
    - "http://127.0.0.1:50151"
